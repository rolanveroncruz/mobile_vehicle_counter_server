[package]
name = "mobile_vehicle_counter_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["full"] }
serde={ version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
base64="0.23.1"
rusqlite={version = "0.40.2", features = ["bundled"]}
uuid={version = "1.27.0", features = ["v4", "serde"]}
tower-http = {version="0.7.1", features = ["cors"]}
sea-query="1.0.2"
async-std = { version = "1", features = ["attributes", "tokio1"] }
sea-orm-migration = { version = "2.0.4", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }