[package]
name = "mobile_vehicle_counter_server"
version = "0.1.0"
edition = "2024"
default-run = "mobile_vehicle_counter_server"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["full"] }
serde={ version = "1.0.229", features = ["derive"]}
base64="0.23.1"
uuid={version = "1.28.0", features = ["v4", "serde"]}
tower-http = {version="0.7.1", features = ["cors"]}
rusqlite = {version="0.35.0", features = ["bundled"]}
jsonwebtoken = "9.3.1"
chrono = '0.4.45'
argon2 =  "0.6.0"
sea-orm = { version="2.0.4", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros",] }
dotenvy = "0.15.7"